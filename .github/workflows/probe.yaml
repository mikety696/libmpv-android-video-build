name: Probe

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  d-no-uses:
    name: D no-uses clone + gh
    runs-on: ubuntu-22.04
    steps:
      - name: clone self
        run: |
          git clone --depth 1 https://github.com/mikety696/libmpv-android-video-build.git src
          ls src | head
      - name: gh availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          which gh && gh --version
          echo "--- auth ---"
          gh auth status || true
          echo "--- api ---"
          gh api repos/mikety696/libmpv-android-video-build --jq .full_name || true
      - name: apt + jdk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk
          java -version
      - name: python meson (PEP668 check)
        run: |
          python3 --version
          python3 -c "import sysconfig,os;print('externally-managed:', os.path.exists(os.path.join(sysconfig.get_path('stdlib'),'EXTERNALLY-MANAGED')))" || true
