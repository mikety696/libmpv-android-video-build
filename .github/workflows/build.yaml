name: Build libmpv-android

# 说明：本 workflow 刻意不使用任何 `uses:`（actions/checkout 等）。
# 原因：本仓库是 fork，仓库级 Actions 白名单会拦截 marketplace action，
# 任何 `uses:` 都会在 "Set up job" 阶段秒失败（实测 v4 / v7 均如此）。
# 因此：checkout 用 git clone、日志与产物用预装的 gh CLI 发到 release。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_REPO: mikety696/libmpv-android-video-build

    steps:
      - name: Build (arm64 only)
        id: build
        continue-on-error: true
        run: |
          set -xo pipefail
          {
            echo "===== 1. checkout ====="
            cd "$GITHUB_WORKSPACE"
            git clone --depth 1 -b main "https://github.com/${GH_REPO}.git" repo
            cd repo
            git log --oneline -1

            echo "===== 2. apt + JDK 17 ====="
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
              openjdk-17-jdk autoconf automake pkg-config libtool \
              ninja-build nasm unzip zip python3-pip python3-setuptools
            # runner 镜像自带 Temurin 11 且优先出现在 PATH，但
            # deps/media-kit-android-helper 用的 AGP 要求 Java 17
            # （报错：Android Gradle plugin requires Java 17 to run）
            JDK17=$(ls -d /usr/lib/jvm/java-17-openjdk-* 2>/dev/null | head -n 1)
            [ -z "$JDK17" ] && JDK17=$(ls -d /usr/lib/jvm/temurin-17-jdk-* 2>/dev/null | head -n 1)
            if [ -z "$JDK17" ]; then echo "ERROR: 找不到 JDK 17"; exit 1; fi
            export JAVA_HOME="$JDK17"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            javac -version

            echo "===== 3. meson ====="
            sudo pip3 install meson || sudo pip3 install --break-system-packages meson
            meson --version

            echo "===== 4. symlink sdk ====="
            cd buildscripts
            mkdir -p sdk
            ln -sfn "${ANDROID_HOME}" ./sdk/android-sdk-linux
            ls -la sdk/
            ls "${ANDROID_HOME}"

            echo "===== 5. bundle (arm64) ====="
            chmod +x ./*.sh ./include/*.sh ./flavors/*.sh
            ./bundle_default.sh

            echo "===== 6. artifacts ====="
            ls -la ./*.jar ./*.zip
            md5sum ./*.jar
          } 2>&1 | tee /tmp/ci.log

      - name: Publish CI log (release asset)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          if gh release view cilog --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete cilog --repo "$GH_REPO" --yes || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/cilog" >/dev/null 2>&1 || true
          fi
          cp /tmp/ci.log ./ci.log
          gh release create cilog --repo "$GH_REPO" --target main \
            --title "CI log" --notes "build log for run $GITHUB_RUN_ID" ./ci.log

      - name: Publish jars (release vnext)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/repo/buildscripts"
          if gh release view vnext --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete vnext --repo "$GH_REPO" --yes || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/vnext" >/dev/null 2>&1 || true
          fi
          gh release create vnext --repo "$GH_REPO" --target main \
            --title "vnext" \
            --notes "v1.1.7 + pan/channelsplit/amerge/aformat (arm64 only)" \
            ./*.jar ./*.zip
          gh release view vnext --repo "$GH_REPO" --json assets --jq '.assets[].name'

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "构建失败，日志已发布到 release cilog"
          exit 1
